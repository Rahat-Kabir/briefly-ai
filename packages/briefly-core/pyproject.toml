[project]
name = "briefly-core"
version = "0.1.6"
description = "Core library for Briefly."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.28",
  "litellm>=1.0",
  "markdownify>=1.2.2",
  "trafilatura>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
