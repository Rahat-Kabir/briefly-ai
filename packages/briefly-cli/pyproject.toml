[project]
name = "briefly-cli"
version = "0.1.3"
description = "Command line interface for Briefly."
requires-python = ">=3.11"
dependencies = [
  "briefly-core",
  "click>=8.0",
]

[project.scripts]
briefly = "briefly_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
