[project]
name = "briefly-ai"
version = "0.1.3"
description = "Briefly AI workspace."
requires-python = ">=3.11"
dependencies = [
  "briefly-cli",
]

[tool.uv.workspace]
members = [
  "packages/briefly-core",
  "packages/briefly-cli",
]

[tool.uv.sources]
briefly-core = { workspace = true }
briefly-cli = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/briefly-core/src",
  "packages/briefly-cli/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".uv-cache",
  ".venv",
]
